<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Mobile Responsive Scaling Tag -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sticky Notes App</title>
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=KoHo:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
body{
    margin:0;
    font-family:Arial;
    background:#f5f5f5;
}

.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#6fa8dc;
    padding:15px 40px;
    color:white;
}

.navbar ul{
    display:flex;
    list-style:none;
    gap:25px;
}

.inputBox{
    text-align:center;
    padding:30px;
    background:black;
}

.inputBox input{
    width:400px;
    max-width: 80%; /* Responsive adjustment */
    padding:10px;
}

.inputBox button{
    padding:10px 20px;
}

#notesContainer{
    display:flex;
    flex-wrap:wrap;
    gap:40px;
    padding:40px 60px;
    margin-top:20px;
}

.note{
    width:180px;
    min-height:200px;
    background-image:url("s.jpg");   
    background-size:cover;
    background-position:center;
    padding:40px 20px 20px 20px;
    /* box-shadow:0 5px 10px rgba(0,0,0,0.6); */
    position:relative;
    transition: transform 0.4s ease, box-shadow 0.4s ease; 
    background-color: transparent;
}

.note h3{
    text-align:left;
    margin:5px 0;
    font-family: 'KoHo', sans-serif;
    margin-top: 50px;
    font-weight: bold;
}

.icons-container{
    position:absolute;
    top:0;
    left:10px;
    width:94%;
    height:30px;
    background:rgb(105, 102, 102);
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:5px;
    padding-right:5px;
    box-sizing:border-box;
    z-index: 2;
}

.icons-container i{
    color:white;
    cursor:pointer;
    font-size:16px;
    /* position: absolute; */
}

.note .time {
    margin-top: -125px;      
    right: 5px;     
    font-size: 15px;
    color: black;
    text-align: right;
    font-family: 'KoHo', sans-serif;
    z-index: 2;
    font-weight: 600; 
}

.note .date {
    position: absolute;
    bottom:35px;
    right:23px;
    font-size:15px;
    color:black;
    z-index: 1;
    font-family: 'KoHo', sans-serif;
    font-weight: 600; 
}

.note:hover {
    transform: scale(1.05); 
}

.note:hover .icons-container {
    background: black;
    transition: 0.3s ease;
}

.note p::before {
    content: "→";      
    margin-right: 5px; 
    color: black;      
    font-weight: bold;
    font-family: 'KoHo', sans-serif;
}

/* --- MOBILE RESPONSIVE MEDIA QUERIES --- */
@media (max-width: 768px) {
    .navbar {
        flex-direction: column;
        padding: 15px;
        text-align: center;
    }

    .navbar ul {
        padding: 0;
        gap: 15px;
        flex-wrap: wrap;
        justify-content: center;
    }

    .inputBox {
        padding: 20px 10px;
    }

    .inputBox input {
        width: 60%;
    }

    #notesContainer {
        padding: 20px;
        justify-content: center;
        gap: 20px;
    }
}
</style>
</head>
<body>

<nav class="navbar">
<h2>Sticky Notes App</h2>
<ul>
<li>Home</li>
<li>About</li>
<li>Portfolio</li>
<li>Services</li>
<li>Contact Us</li>
</ul>
</nav>

<div class="inputBox">
<input type="text" id="noteInput" placeholder="Add Your Notes">
<button class="addBtn" id="addBtn">Add</button>
</div>

<div id="notesContainer"></div>

<script>
function displayTime() {
    const now = new Date();
    let hrs = now.getHours();
    let min = now.getMinutes();
    let sec = now.getSeconds();

    if (hrs === 0) hrs = 12;
    if (hrs < 10) hrs = "0" + hrs;
    if (min < 10) min = "0" + min;
    if (sec < 10) sec = "0" + sec;

    return `${hrs}:${min}:${sec}`;
}

function displayDate() {
    const now = new Date();

    const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];

    const dayName = days[now.getDay()];
    const dayNum = now.getDate();
    const monthName = months[now.getMonth()];
    const year = now.getFullYear();

    return `${dayName}, ${dayNum} ${monthName}, ${year}`;
}

document.addEventListener("DOMContentLoaded", function(){

const addBtn = document.getElementById("addBtn");
const noteInput = document.getElementById("noteInput");
const notesContainer = document.getElementById("notesContainer");

let notes = JSON.parse(localStorage.getItem("notes")) || [];

loadNotes();

// ADD NOTE
addBtn.addEventListener("click", function(){

    const text = noteInput.value;
    if(text === "")
     return;

    const noteObj = {
        text: text,
        time: displayTime(),
        date: displayDate()
    };

    notes.push(noteObj);
    localStorage.setItem("notes", JSON.stringify(notes));
    noteInput.value = "";
    loadNotes();

});

// LOAD NOTES
function loadNotes(){
    notesContainer.innerHTML = "";
    notes.forEach(function(noteObj,index){
        createNoteItem(noteObj,index);
    });
}

// CREATE NOTE
function createNoteItem(noteObj,index){

    const note = document.createElement("div");
    note.className = "note";

    const iconsContainer = document.createElement("div");
    iconsContainer.className = "icons-container";

    const editIcon = document.createElement("i");
    editIcon.className = "fa-solid fa-pen-to-square";

    const deleteIcon = document.createElement("i");
    deleteIcon.className = "fa-solid fa-trash";

    //input field
    const editInput = document.createElement("input");
    editInput.type = "text";
    editInput.style.display = "none";
    editInput.style.height = "20px";
    editInput.style.fontSize = "12px";
    editInput.style.marginRight = "5px";

    iconsContainer.appendChild(editInput);
    iconsContainer.appendChild(editIcon);
    iconsContainer.appendChild(deleteIcon);

    const heading = document.createElement("h3");
    heading.innerText = "Sticky Notes";

    const para = document.createElement("p");
    para.innerText = noteObj.text;

    //Time
    const timeDiv = document.createElement("div");
    timeDiv.className = "time";
    timeDiv.innerText = noteObj.time;

    //Date
    const dateDiv = document.createElement("div");
    dateDiv.className = "date";
    dateDiv.innerText = noteObj.date;

    note.appendChild(iconsContainer);
    note.appendChild(heading);
    note.appendChild(para);
    note.appendChild(timeDiv);
    note.appendChild(dateDiv);

    notesContainer.appendChild(note);

    // EDIT
    let editing = false;

    editIcon.addEventListener("click", function(){

        if(!editing){
            editInput.style.display = "block";
            editInput.value = noteObj.text;
            editInput.focus();
            editing = true;
        }
        else {
            notes[index].text = editInput.value;
            notes[index].time = displayTime();
            notes[index].date = displayDate();

            localStorage.setItem("notes", JSON.stringify(notes));
            loadNotes();
        } 

    });

    // DELETE
    deleteIcon.addEventListener("click", function(){
        notes.splice(index,1);
        localStorage.setItem("notes", JSON.stringify(notes));
        loadNotes();
    });

}

});
</script>
</body>
</html>
